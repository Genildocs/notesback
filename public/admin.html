<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="admin.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="sidebar bg-gray-800 text-white w-64 p-4">
            <h1 class="text-2xl font-bold mb-8">Painel Admin</h1>
            <nav>
                <div class="sidebar-item active p-2 rounded cursor-pointer mb-2">
                    Gerenciar Usuários
                </div>
            </nav>
        </div>

        <!-- Conteúdo Principal -->
        <div class="main-content flex-1 p-8">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Gerenciamento de Usuários</h2>
                    <div class="flex space-x-4">
                        <input type="text" id="searchInput" placeholder="Buscar usuários..." class="px-4 py-2 border rounded-lg">
                        <select id="roleFilter" class="px-4 py-2 border rounded-lg">
                            <option value="">Todos os Roles</option>
                            <option value="admin">Admin</option>
                            <option value="user">Usuário</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="usersTableBody">
                            <!-- Dados dos usuários serão inseridos aqui via JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div class="flex justify-between items-center mt-4">
                    <div class="text-sm text-gray-500">
                        Mostrando <span id="showingFrom">1</span> a <span id="showingTo">10</span> de <span id="totalUsers">0</span> usuários
                    </div>
                    <div class="flex space-x-2">
                        <button id="prevPage" class="btn px-4 py-2 bg-gray-200 rounded-lg disabled:opacity-50">Anterior</button>
                        <button id="nextPage" class="btn px-4 py-2 bg-gray-200 rounded-lg disabled:opacity-50">Próximo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="editModal" class="modal fixed inset-0 bg-black bg-opacity-50 hidden">
        <div class="modal-content bg-white rounded-lg p-6 max-w-md mx-auto mt-20">
            <h3 class="text-xl font-bold mb-4">Editar Usuário</h3>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Username</label>
                    <input type="text" id="editUsername" class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="editEmail" class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Role</label>
                    <select id="editRole" class="w-full px-4 py-2 border rounded-lg">
                        <option value="user">Usuário</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Status</label>
                    <select id="editStatus" class="w-full px-4 py-2 border rounded-lg">
                        <option value="active">Ativo</option>
                        <option value="inactive">Inativo</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancelEdit" class="btn px-4 py-2 bg-gray-200 rounded-lg">Cancelar</button>
                    <button type="submit" class="btn px-4 py-2 bg-blue-500 text-white rounded-lg">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const usersPerPage = 10;
        let allUsers = [];

        // Função para carregar usuários
        async function loadUsers() {
            try {
                const response = await fetch('/api/users', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                
                if (!response.ok) throw new Error('Erro ao carregar usuários');
                
                allUsers = await response.json();
                renderUsers();
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao carregar usuários');
            }
        }

        // Função para renderizar usuários na tabela
        function renderUsers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const roleFilter = document.getElementById('roleFilter').value;
            
            let filteredUsers = allUsers.filter(user => {
                const matchesSearch = user.username.toLowerCase().includes(searchTerm) || 
                                    user.email.toLowerCase().includes(searchTerm);
                const matchesRole = !roleFilter || user.role === roleFilter;
                return matchesSearch && matchesRole;
            });

            const startIndex = (currentPage - 1) * usersPerPage;
            const endIndex = startIndex + usersPerPage;
            const paginatedUsers = filteredUsers.slice(startIndex, endIndex);

            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            paginatedUsers.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${user.username}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${user.email}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 rounded-full ${user.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">
                            ${user.role}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 rounded-full ${user.active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${user.active ? 'Ativo' : 'Inativo'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <button onclick="editUser('${user._id}')" class="text-blue-500 hover:text-blue-700 mr-2">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteUser('${user._id}')" class="text-red-500 hover:text-red-700">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Atualizar paginação
            document.getElementById('showingFrom').textContent = startIndex + 1;
            document.getElementById('showingTo').textContent = Math.min(endIndex, filteredUsers.length);
            document.getElementById('totalUsers').textContent = filteredUsers.length;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = endIndex >= filteredUsers.length;
        }

        // Função para editar usuário
        async function editUser(userId) {
            const user = allUsers.find(u => u._id === userId);
            if (!user) return;

            document.getElementById('editUserId').value = userId;
            document.getElementById('editUsername').value = user.username;
            document.getElementById('editEmail').value = user.email;
            document.getElementById('editRole').value = user.role;
            document.getElementById('editStatus').value = user.active ? 'active' : 'inactive';

            document.getElementById('editModal').classList.remove('hidden');
        }

        // Função para deletar usuário
        async function deleteUser(userId) {
            if (!confirm('Tem certeza que deseja deletar este usuário?')) return;

            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) throw new Error('Erro ao deletar usuário');
                
                await loadUsers();
                alert('Usuário deletado com sucesso');
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao deletar usuário');
            }
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', renderUsers);
        document.getElementById('roleFilter').addEventListener('change', renderUsers);
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderUsers();
            }
        });
        document.getElementById('nextPage').addEventListener('click', () => {
            currentPage++;
            renderUsers();
        });
        document.getElementById('cancelEdit').addEventListener('click', () => {
            document.getElementById('editModal').classList.add('hidden');
        });
        document.getElementById('editUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = document.getElementById('editUserId').value;
            const userData = {
                username: document.getElementById('editUsername').value,
                email: document.getElementById('editEmail').value,
                role: document.getElementById('editRole').value,
                active: document.getElementById('editStatus').value === 'active'
            };

            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(userData)
                });

                if (!response.ok) throw new Error('Erro ao atualizar usuário');
                
                await loadUsers();
                document.getElementById('editModal').classList.add('hidden');
                alert('Usuário atualizado com sucesso');
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao atualizar usuário');
            }
        });

        // Carregar usuários ao iniciar
        loadUsers();
    </script>
</body>
</html>
